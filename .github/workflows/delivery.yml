name: Delivery

# Continuous delivery (ADR 0007): every push to main is released by release-please
# when it is a release commit, built once, and deployed to staging; a release then
# promotes the same image digest to production after the maintainer's approval.

on:
  push:
    branches: [main]

permissions:
  contents: read

# No workflow-wide concurrency: a release waiting for approval must not hold back
# later merges, and a queued run must never be cancelled before release-please has
# seen its commit. Each deployment target is serialised by its own job group instead.

env:
  REGION: europe-west1
  IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}/devpulse
  # The deterministic URLs, the only names the server answers (infra/run.tf).
  STAGING_URL: https://devpulse-staging-865877702597.europe-west1.run.app
  PRODUCTION_URL: https://devpulse-865877702597.europe-west1.run.app

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A dedicated token lets CI run on the release pull request; see ADR 0004.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Short-lived OIDC tokens, exchanged for Google credentials and used to sign
      # the attestations. No long-lived key exists anywhere.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check the repository variables
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          REPOSITORY: ${{ vars.GCP_IMAGE_REPOSITORY }}
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ] || [ -z "$REPOSITORY" ]; then
            echo "::error::Set the GCP_* repository variables; see docs/DEVELOPMENT.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Also mint an access token, valid one hour, for the registry clients below.
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: push
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # A plain single-platform image: BuildKit attestations would turn it into an
          # index. Provenance and SBOM are signed by GitHub below instead.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate the SBOM of the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: oauth2accesstoken
          TRIVY_PASSWORD: ${{ steps.auth.outputs.access_token }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
      # Signed statements, verifiable with `gh attestation verify`: this digest was
      # built by this workflow from this commit, and contains these packages.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.cdx.json

  staging:
    name: deploy to staging
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Staging is private (ADR 0008): the smoke test proves its identity.
          token_format: id_token
          id_token_audience: ${{ env.STAGING_URL }}
          id_token_include_email: true
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy the image by digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: gcloud run deploy devpulse-staging --image "${IMAGE}@${DIGEST}" --region "$REGION" --quiet
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.STAGING_URL }}
          token: ${{ steps.auth.outputs.id_token }}

  production:
    name: deploy to production
    needs: [release-please, build, staging]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    # Requires the maintainer's approval before any step runs.
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: devpulse
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Tag the tested image with the release version
        run: gcloud artifacts docker tags add "${IMAGE}@${DIGEST}" "${IMAGE}:${VERSION}" --quiet
      - id: current
        name: Remember the revision serving all traffic
        # jq -e fails the step if no revision serves 100%, so a rollback never
        # targets an unknown revision.
        run: |
          revision=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -er '[.status.traffic[] | select(.percent == 100)][0].revisionName')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - id: candidate
        name: Deploy the release without traffic
        run: |
          gcloud run deploy "$SERVICE" --image "${IMAGE}@${DIGEST}" --region "$REGION" \
            --no-traffic --tag candidate --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -er '.status.traffic[] | select(.tag == "candidate")
                | "revision=\(.revisionName)\nurl=\(.url)"' >> "$GITHUB_OUTPUT"
      # The tag URL is not in ALLOWED_HOSTS, so only the health check, which accepts
      # any Host, can run before the switch.
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ steps.candidate.outputs.url }}
          report: 'false'
      - id: promote
        name: Move all traffic to the release
        env:
          CANDIDATE: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${CANDIDATE}=100" --remove-tags candidate --quiet
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.PRODUCTION_URL }}
      - name: Roll back to the previous revision
        # Also covers a traffic switch that failed or was cancelled half-way; sending
        # traffic to the recorded revision is idempotent.
        if: (failure() || cancelled()) && steps.promote.outcome != 'skipped'
        env:
          PREVIOUS: ${{ steps.current.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${PREVIOUS}=100" --remove-tags candidate --quiet
          echo "::error::The release did not pass its checks; traffic is back on ${PREVIOUS}."
      - name: Remove the tag of a rejected candidate
        if: failure() && steps.candidate.outcome == 'success' && steps.promote.outcome == 'skipped'
        run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags candidate --quiet
