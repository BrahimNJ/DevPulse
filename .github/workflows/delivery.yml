name: Delivery

# Continuous delivery (ADR 0007): every push to main is released by release-please
# when it is a release commit, built once, and deployed to staging; a release then
# promotes the same image digest to production after the maintainer's approval.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: delivery
  cancel-in-progress: false

env:
  REGION: europe-west1
  IMAGE: ${{ vars.GCP_IMAGE_REPOSITORY }}/devpulse
  # The deterministic URLs, the only names the server answers (infra/run.tf).
  STAGING_URL: https://devpulse-staging-865877702597.europe-west1.run.app
  PRODUCTION_URL: https://devpulse-865877702597.europe-west1.run.app

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A dedicated token lets CI run on the release pull request; see ADR 0004.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Short-lived OIDC tokens, exchanged for Google credentials and used to sign
      # the provenance attestation. No long-lived key exists anywhere.
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: push
        name: Build and push the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # An SBOM and a full provenance attestation are stored with the image.
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # A signed statement, verifiable with `gh attestation verify`, that this digest
      # was built by this workflow from this commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}

  staging:
    name: deploy to staging
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Deploy the image by digest
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: gcloud run deploy devpulse-staging --image "${IMAGE}@${DIGEST}" --region "$REGION" --quiet
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.STAGING_URL }}

  production:
    name: deploy to production
    needs: [release-please, build, staging]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Requires the maintainer's approval before any step runs.
    environment:
      name: production
      url: ${{ env.PRODUCTION_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      SERVICE: devpulse
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Tag the tested image with the release version
        run: gcloud artifacts docker tags add "${IMAGE}@${DIGEST}" "${IMAGE}:${VERSION}" --quiet
      - id: current
        name: Remember the revision serving traffic now
        run: |
          revision=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '[.status.traffic[] | select(.percent == 100)][0].revisionName')
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - id: candidate
        name: Deploy the release without traffic
        run: |
          gcloud run deploy "$SERVICE" --image "${IMAGE}@${DIGEST}" --region "$REGION" \
            --no-traffic --tag candidate --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate")
                | "revision=\(.revisionName)\nurl=\(.url)"' >> "$GITHUB_OUTPUT"
      # The tag URL is not in ALLOWED_HOSTS, so only the health check, which accepts
      # any Host, can run before the switch.
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ steps.candidate.outputs.url }}
          report: 'false'
      - id: promote
        name: Move all traffic to the release
        env:
          CANDIDATE: ${{ steps.candidate.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${CANDIDATE}=100" --remove-tags candidate --quiet
      - uses: ./.github/actions/smoke-test
        with:
          url: ${{ env.PRODUCTION_URL }}
      - name: Roll back to the previous revision
        if: failure() && steps.promote.outcome == 'success'
        env:
          PREVIOUS: ${{ steps.current.outputs.revision }}
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" \
            --to-revisions "${PREVIOUS}=100" --quiet
          echo "::error::Production smoke test failed; traffic is back on ${PREVIOUS}."
