version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      lint-and-format:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - eslint-config-prettier
          - globals
          - prettier
          - markdownlint-cli2
      commit-tooling:
        patterns:
          - '@commitlint/*'
          - husky
          - lint-staged
    ignore:
      # Major upgrades of the language and runtime types are ADR-level decisions.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
